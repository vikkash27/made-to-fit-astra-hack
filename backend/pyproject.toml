[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "made-to-fit-backend"
version = "0.1.0"
description = "Native CAD and bounded AI orchestration for Made to Fit"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "trimesh>=4.6,<5",
  "pypdf>=5,<7",
  "beautifulsoup4>=4.13,<5",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
